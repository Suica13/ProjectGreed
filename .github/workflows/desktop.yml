name: Desktop client
on:
  workflow_dispatch:
  push:
    branches: [clientTest]
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win --x64
          - os: ubuntu-22.04
            args: --linux --x64
          - os: macos-latest
            args: --mac --x64 --arm64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:desktop
      - if: runner.os != 'Linux'
        run: npm run test:desktop
      - run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: ProjectGreed-${{ matrix.os }}
          path: |
            dist/desktop/*.exe
            dist/desktop/*.zip
            dist/desktop/*.dmg
            dist/desktop/*.AppImage
            dist/desktop/*.tar.gz
          if-no-files-found: error

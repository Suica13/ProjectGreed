plugins { id 'com.android.application' }

android {
    namespace 'io.projectgreed.apptest2'
    compileSdk 36
    buildToolsVersion '36.0.0'
    buildFeatures { buildConfig true }
    defaultConfig {
        applicationId 'io.projectgreed.apptest2'
        minSdk 26
        targetSdk 35
        testInstrumentationRunner 'io.projectgreed.apptest2.StoreInstrumentation'
        versionCode 101000
        versionName 'V101'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets.main.assets.srcDirs = ["${rootDir}/../../build/app-client/content"]
    // Keep debug update identity independent of the sandbox Java user.home.
    signingConfigs {
        debug {
            if (project.hasProperty("projectGreedDebugKeystore")) {
                storeFile file(project.property("projectGreedDebugKeystore"))
            }
        }
    }
    buildTypes {
        debug { debuggable true }
        release { minifyEnabled false }
    }
    androidResources { noCompress 'ogg', 'mp3', 'wav' }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}

appId: com.suica13.projectgreed
productName: ProjectGreed
asar: true
npmRebuild: false
directories:
  output: dist/desktop
files:
  - desktop/main.cjs
  - public/client.html
  - package.json
  - "!node_modules/**"
artifactName: "${productName}-${version}-${os}-${arch}.${ext}"
win:
  target: [nsis, zip]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
mac:
  target: [dmg, zip]
  category: public.app-category.games
linux:
  target: [AppImage, tar.gz]
  category: Game

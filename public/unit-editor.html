<header><div><small>PROJECT GREED · UNIT WORKSHOP</small><h1>MS 单位工坊</h1></div><nav><button id="undo">撤销</button><button id="redo">重做</button><button id="open">导入工程</button><button id="save">保存工程</button><button id="export" class="primary">导出 ProjectGreed 单位</button><button id="exportRW">导出 RW_GW 单位</button></nav></header>
<main><aside><h2>01 / 新单位</h2><label>参考模板<select id="template"></select></label><button id="new">复制为新单位</button><label>单位 ID<input id="id"></label><label>名称<input id="name"></label><label>编号<input id="code"></label><p class="hint">复制模板保留原始数值与武器。原单位不会被覆盖；保存工程后可继续编辑。</p><h2>02 / 部件图层</h2><select id="layer" size="12"></select><div class="row"><button id="duplicate">复制图层</button><button id="remove">删除图层</button></div><label>图层名称<input id="layerName"></label><label>贴图<select id="texture"></select></label><button id="replaceTexture">替换此贴图（所有引用）</button><button id="uniqueTexture">为此图层导入独立贴图</button><button id="setIcon">将此贴图用作单位图标</button><label>绑定骨骼<select id="bone"></select></label><div class="fields" id="layerFields"></div><h3>所绑定骨骼（影响所有挂载部件）</h3><div class="fields" id="boneFields"></div></aside>
<section class="stage"><div class="previewbar"><label>套件<select id="kit"></select></label><label>持握武器<select id="weapon"></select></label><label>方向<input id="angle" type="range" min="0" max="360" value="90"></label><label>放大<input id="zoom" type="range" min="0.5" max="12" step="0.25" value="4"></label></div><div class="flags"><label><input type="checkbox" id="moving">移动</label><label><input type="checkbox" id="attacking">攻击</label><label><input type="checkbox" id="shield" checked>盾牌</label><label><input type="checkbox" id="grid" checked>像素网格</label><label><input type="checkbox" id="bones" checked>骨骼</label><select id="environment"><option value="ground">地面</option><option value="space">宇宙</option></select></div><div id="viewport"><canvas id="preview"></canvas></div><div class="timeline"><div class="row"><button id="play">暂停</button><button id="step">前进 1/30 秒</button><select id="clip"></select><label>时长<input id="duration" type="number" min="0.01" step="0.1"></label></div><input id="time" type="range" min="0" step="0.001"><output id="clock"></output></div><p id="status" role="status">加载中</p></section>
<aside><h2>03 / 武器显隐</h2><p class="hint">编辑所选图层；所有条件同时满足才显示。“保留”不改动模板原有条件。</p><label><input id="hidden" type="checkbox">始终隐藏</label><label>仅这些套件可见（多选，空选不限）<select id="visibleKits" multiple size="3"></select></label><label>持握条件<select id="heldRule"><option value="keep">保留现有</option><option value="any">不限</option><option value="is">持握当前武器时显示</option><option value="not">持握当前武器时隐藏</option></select></label><label>攻击条件<select id="attackRule"><option value="keep">保留现有</option><option value="any">不限</option><option value="yes">攻击时显示</option><option value="no">攻击时隐藏</option></select></label><button id="applyVisibility">应用显隐条件</button><label>完整显隐规则（JSON）<textarea id="visibility" rows="5"></textarea></label><button id="applyVisibilityJson">应用 JSON 条件</button><label>动画显隐区间（JSON，空对象清除）<textarea id="visibilityWindow" rows="3"></textarea></label><button id="applyWindow">应用动画区间</button><p id="visibleStatus"></p>
<h2>04 / 武器绑定</h2><label>当前武器射击动画<select id="weaponClip"></select></label><label>显示索引<input id="displayIndex" type="number" min="0" step="1"></label><label>枪口绑定图层<select id="muzzleLayer"></select></label><div class="fields"><label>枪口 X<input id="muzzleX" type="number" step="0.25"></label><label>枪口 Y<input id="muzzleY" type="number" step="0.25"></label></div><button id="applyWeapon">保存当前武器绑定</button>
<h2>05 / 动画关键帧</h2><p class="hint">编辑当前动画、当前图层绑定的骨骼。位置为相对骨骼的偏移，旋转单位为度；曲线使用游戏原有线性插值。</p><label>动画字段<select id="curveField"><option>x</option><option>y</option><option>dir</option><option>height</option></select></label><label>当前时间的关键帧值<input id="keyValue" type="number" step="0.25" value="0"></label><button id="addKey">在当前时间添加 / 替换</button><div id="keys"></div><label>复制当前动画的新名称<input id="newClip" placeholder="Custom_Attack"></label><button id="copyClip">复制动画</button><p class="hint">导出包包含所有单位贴图与动画。武器伤害等继承模板；共用音效、弹体特效依赖原项目。</p></aside></main>

 $('file').onchange=()=>run(async()=>{const file=$('file').files[0];if(!file)return;if(file.size>32*1024*1024)throw Error('文件超过32MB');if(purpose==='project'){const p=JSON.parse(await file.text());UnitAuthoring.validate(p,EXISTING_UNIT_IDS);if(dirty&&!confirm('替换未保存工程？'))return;await load(p);return;}
 if(!/^image\/(png|jpeg|webp)$/.test(file.type))throw Error('请选择 PNG/JPEG/WebP');const src=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(Error('读取图片失败'));reader.readAsDataURL(file);});const im=new Image();im.src=src;await im.decode();if(im.width>4096||im.height>4096)throw Error('图片长宽上限4096像素');transaction(()=>{const key=purpose==='replace'?layer().texture:'custom_'+Date.now()+'.'+file.type.split('/')[1];project.textures[key]=src;layer().texture=key;});await images();});
 window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue='';}});
 function draw(now){requestAnimationFrame(draw);if(!project)return;const dt=Math.min(.1,(now-last)/1000||0);last=now;if(playing)time=(time+dt)%animation().duration;
 const box=$('viewport').getBoundingClientRect(),dpr=devicePixelRatio||1; if(canvas.width!==Math.round(box.width*dpr)||canvas.height!==Math.round(box.height*dpr)){canvas.width=Math.round(box.width*dpr);canvas.height=Math.round(box.height*dpr);}
 ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,box.width,box.height);const cx=box.width/2,cy=box.height/2,z=Number($('zoom').value),angle=Number($('angle').value);
 if($('grid').checked){ctx.strokeStyle='#24313d';ctx.lineWidth=.5;const step=Math.max(z,4);ctx.beginPath();for(let x=cx%step;x<box.width;x+=step){ctx.moveTo(x,0);ctx.lineTo(x,box.height);}for(let y=cy%step;y<box.height;y+=step){ctx.moveTo(0,y);ctx.lineTo(box.width,y);}ctx.stroke();}
 ctx.strokeStyle='#496575';ctx.beginPath();ctx.moveTo(cx,0);ctx.lineTo(cx,box.height);ctx.moveTo(0,cy);ctx.lineTo(box.width,cy);ctx.stroke();
 try{SpriteRenderer.draw(ctx,'preview',cx,cy,z,angle,$('clip').value,time,$('weapon').value,false,$('shield').checked,$('moving').checked,{},angle,$('attacking').checked,true,$('environment').value);
 const pose=SpriteRenderer.pose('preview',$('clip').value,time,false);
 if($('bones').checked)for(const bone of Object.keys(project.unit.skeleton)){const t=SpriteRenderer.layerTransform('preview',{bone},angle,pose);ctx.fillStyle=bone===layer().bone?'#77ffd0':'#ffffff88';ctx.fillRect(cx+t.x*z-2,cy+t.y*z-2,4,4);if(bone===layer().bone){ctx.fillStyle='#77ffd0';ctx.fillText(bone,cx+t.x*z+6,cy+t.y*z-5);}}
 if(weapon().muzzle?.layer){const w={...weapon(),attack:weapon().attack||{}};const m=SpriteRenderer.muzzle('preview',w,{x:cx,y:cy,angle,scale:z},$('clip').value,time);ctx.strokeStyle='#ffd273';ctx.beginPath();ctx.arc(m.x,m.y,5,0,Math.PI*2);ctx.stroke();}
 const visible=SpriteRenderer.visibleLayers('preview',$('weapon').value,$('shield').checked,$('moving').checked,$('clip').value,time,false,{},$('attacking').checked,true,$('environment').value);$('visibleStatus').textContent=visible.some(l=>l.name===layer().name)?'当前图层：可见':'当前图层：隐藏（条件未满足）';
 }catch(e){status('预览失败：'+e.message);playing=false;}
 $('time').value=time;$('clock').textContent=time.toFixed(3)+' / '+animation().duration.toFixed(3)+' s';
 }
 run(()=>load(UnitAuthoring.newProject(UNIT_TEMPLATES[0])));requestAnimationFrame(draw);
 return {get project(){return project},load,exportFiles:()=>UnitAuthoring.exportFiles(project,EXISTING_UNIT_IDS)};
})();
</script></body></html>

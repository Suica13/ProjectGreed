<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>联络人委托策划树</title><style>__CSS__</style></head><body>
<header><div><b>ProjectGreed</b><span>联络人委托策划树</span></div><nav><a class="admin-link" href="index.html">管理工具</a><button id="new">新建</button><button id="import">导入JSON</button><button id="export">导出当前联络人JSON</button><button id="ai" class="primary">导出AI制作说明</button><button id="preview">预览 / 校验</button></nav></header>
<input id="file" type="file" accept=".json,application/json" hidden>
<section class="project"><label>委托系统版本号<input id="systemVersion" maxlength="100" placeholder="例如1.0、2026.11.22"></label><label>联络人<select id="contact"></select></label><label>联络人名称<input id="contactName" maxlength="100"></label><button id="addContact">＋ 联络人</button><button id="contactText">联络人文本 / 头像</button></section>
<main><aside class="library"><button id="addTask" class="primary">＋ 新增委托</button><button id="addRoot">＋ 独立委托</button><input id="search" placeholder="搜索委托名称或文本" aria-label="搜索委托"><label>标记筛选<select id="statusFilter"><option value="">全部</option></select></label><div id="taskList"></div><h2>改动标记说明</h2><div id="legend"></div><label>全局策划备注<textarea id="notes" placeholder="AI需要遵循的共同要求"></textarea></label></aside>
<section class="workspace"><div class="toolbar"><span id="count"></span><div><button id="undo">撤销</button><button id="redo">重做</button><button id="zoomOut" aria-label="缩小">−</button><span id="zoom">100%</span><button id="zoomIn" aria-label="放大">＋</button><button id="center">定位选中</button></div></div><div id="canvas"><div id="scene"><svg id="edges" aria-hidden="true"></svg><div id="nodes"></div></div></div><footer id="status" role="status">纯策划文档，不连接游戏</footer></section>
<aside class="inspector"><h2 id="panelTitle">委托策划</h2><div id="inspector"></div></aside></main>
<dialog id="output"><h2>策划文档预览</h2><p id="validation"></p><textarea id="json" readonly aria-label="导出预览"></textarea><div class="dialog-actions"><button id="copy">复制</button><button id="close">关闭</button></div></dialog>
<script>__DATA__</script><script>__JS__</script></body></html>

<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ProjectGreed 任务树编辑器</title><style>__CSS__</style></head><body>
<header><div><b>ProjectGreed</b><span>任务树编辑器 · __VERSION__</span></div><nav><button id="new">新建</button><button id="sample">示例</button><button id="import">导入JSON</button><button id="export">导出设计JSON</button><button id="ai" class="primary">导出AI制作说明</button><button id="preview">预览 / 校验</button></nav></header>
<input type="file" id="file" accept=".json,application/json" hidden>
<section class="project"><label>任务名称<input id="title" maxlength="150"></label><label>年代<select id="era"></select></label><label>环境<select id="environment"><option value="ground">地面</option><option value="space">宇宙</option></select></label><label>COST上限<input id="cost" type="number" min="500" max="1000000" step="25"></label><label>舰船上限<input id="fleet" type="number" min="1" max="6"></label></section>
<main><aside class="library"><h2>添加节点</h2><input id="search" placeholder="搜索事件、动作或说明" aria-label="搜索节点类型"><p class="hint">选择树中节点，再点击类型可添加子节点。节点之间的连线表示设计顺序或前置依赖。</p><div id="library"></div></aside>
<section class="workspace"><div class="toolbar"><span id="count"></span><div><button id="undo">撤销</button><button id="redo">重做</button><button id="zoomOut" aria-label="缩小">−</button><span id="zoom">100%</span><button id="zoomIn" aria-label="放大">＋</button><button id="center">定位选中</button></div></div><div id="canvas"><div id="scene"><svg id="edges" aria-hidden="true"></svg><div id="nodes"></div></div></div><footer id="status" role="status">准备就绪</footer></section>
<aside class="inspector"><h2>节点设置</h2><div id="inspector"></div></aside></main>
<dialog id="output"><h2>设计校验与导出预览</h2><p id="validation"></p><textarea id="json" readonly aria-label="导出预览"></textarea><div class="dialog-actions"><button id="copy">复制内容</button><button id="close">关闭</button></div></dialog>
<script>__DATA__</script><script>__JS__</script></body></html>
